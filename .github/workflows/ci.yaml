name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Restrict GITHUB_TOKEN to read-only for all jobs
permissions:
  contents: read

jobs:
  lint:
    # SECURITY: PRs from forks run on GitHub-hosted runners to prevent
    # arbitrary code execution on self-hosted infrastructure.
    # Only pushes to master (trusted code) run on self-hosted runners.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted", "linux", "x64", "krubecible", "holybits-shared"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Pinned, not `pip install ruff`: an unpinned linter changes its default
      # rule selection between releases, so a green run could turn red (or a
      # real finding could disappear) on a day nothing in this repo changed.
      # Bump this deliberately, in a commit that addresses whatever the new
      # version flags.
      - run: pip install ruff==0.17.4
      - run: ruff check .

  test:
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted", "linux", "x64", "krubecible", "holybits-shared"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov aiohttp
      - run: pytest --cov=custom_components/lumin --cov-report=xml -v || echo "No tests yet"
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: always()

  validate:
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted", "linux", "x64", "krubecible", "holybits-shared"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Validate manifest
        run: python -c "import json; json.load(open('custom_components/lumin/manifest.json'))"
      - name: Validate strings
        run: python -c "import json; json.load(open('custom_components/lumin/strings.json'))"
      - name: Validate translations
        run: python -c "import json; json.load(open('custom_components/lumin/translations/en.json'))"
      - name: Check manifest.json version matches the released version
        # `.release-please-manifest.json` records the version the release
        # workflow last tagged; `custom_components/lumin/manifest.json` is the
        # version Home Assistant displays and HACS validates. Both must be
        # bumped by the same `chore(release)` commit, so drift means a release
        # step half-ran (the tag would then disagree with what users install).
        #
        # This guard caught release PR #15 (0.1.2): the release workflow passed
        # `release-type` as an action input, which made release-please ignore
        # `release-please-config.json` (and therefore `extra-files`) entirely.
        # The file name is kept from the release-please era because
        # `.github/scripts/release.py` still reads and writes it.
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          released = json.loads(pathlib.Path(".release-please-manifest.json").read_text())["."]
          manifest = json.loads(
              pathlib.Path("custom_components/lumin/manifest.json").read_text()
          )
          version = manifest.get("version")
          if version != released:
              raise SystemExit(
                  f"manifest.json version {version!r} does not match the last "
                  f"released version {released!r}. "
                  "release-please did not bump custom_components/lumin/manifest.json. "
                  "Check that .github/workflows/release.yaml does NOT pass a "
                  "`release-type` input (it bypasses release-please-config.json), "
                  "and that release-please-config.json lists the file under "
                  "`extra-files` as "
                  '{"type": "json", "path": "custom_components/lumin/manifest.json", '
                  '"jsonpath": "$.version"}.'
              )
          print(f"manifest.json version matches the released version: {released}")
          PY

      - name: Check the release configuration is intact
        # Two regressions have already cost a release, so pin both:
        #  1. a `release-type` action input silently disables
        #     `release-please-config.json` (that was release PR #15);
        #  2. `extra-files` must keep the *explicit* JSON entry with
        #     `jsonpath: $.version`, because a bare path relies on an updater
        #     default that has already no-opped once.
        # Comments are stripped before matching so prose about the bug does not
        # trip the check.
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          problems = []

          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              for number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  code = line.split("#", 1)[0]
                  if re.match(r"\s*release-type\s*:", code):
                      problems.append(
                          f"{path}:{number}: `release-type` input found; it makes "
                          "release-please-action ignore release-please-config.json"
                      )

          config = json.loads(pathlib.Path("release-please-config.json").read_text())
          extra_files = config["packages"]["."].get("extra-files", [])
          expected = {
              "type": "json",
              "path": "custom_components/lumin/manifest.json",
              "jsonpath": "$.version",
          }
          if expected not in extra_files:
              problems.append(
                  "release-please-config.json: `extra-files` must contain "
                  f"{json.dumps(expected)}; .github/scripts/release.py writes the "
                  "manifest version through that entry"
              )

          if problems:
              print("\n".join(problems), file=sys.stderr)
              raise SystemExit(1)
          print("release configuration is intact")
          PY
