name: Release
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  # Needed by `dispatch-image-build`: release-please creates its tag with
  # GITHUB_TOKEN, and GitHub does not run `on: push: tags` workflows for a tag
  # pushed by GITHUB_TOKEN, so the image build must be dispatched explicitly.
  actions: write

jobs:
  release-please:
    runs-on: [self-hosted, linux, x64, krubecible, holybits-shared]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56e235 # v4.1.3
        id: release
        with:
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}

  sync-manifest:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, linux, x64, krubecible, holybits-shared]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json version
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          python3 -c "
          import json, pathlib
          p = pathlib.Path('custom_components/lumin/manifest.json')
          m = json.loads(p.read_text())
          m['version'] = '${VERSION}'
          p.write_text(json.dumps(m, indent=2) + '\n')
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/lumin/manifest.json
          git diff --cached --quiet || git commit -m "chore: sync manifest.json to v${VERSION}"
          git push

  dispatch-image-build:
    # release-please mints the tag with GITHUB_TOKEN, and GitHub does not start
    # `on: push: tags` workflows for a tag pushed by GITHUB_TOKEN — so the v*
    # trigger in publish-image.yaml would never fire for a real release.
    # Dispatch the build at the new tag explicitly (ADR-0073 Amendment 1: the
    # image for a release is built from the release tag, never from a guess).
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, linux, x64, krubecible, holybits-shared]
    steps:
      - name: Dispatch publish-image.yaml at the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::release-please reported release_created=true but no tag_name"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-image.yaml/dispatches" \
            -d "{\"ref\":\"${TAG}\"}"
          echo "Dispatched publish-image.yaml at ${TAG}."
