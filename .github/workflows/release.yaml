name: Release

# Two-step release, with no branch-protection bypass anywhere.
#
#  1. A qualifying merge to `master` (fix/feat/perf/deps/revert, or a breaking
#     change) makes this workflow compute the next version, write the version
#     files and CHANGELOG, push a `release/vX.Y.Z` branch, and open a small
#     "chore(release): vX.Y.Z" pull request.
#  2. When that PR is merged, the push it creates has a `chore(release):` HEAD,
#     so this workflow tags that commit and publishes the GitHub release.
#
# Why a PR instead of pushing straight to `master`: the version commit has to
# touch `master`, which requires 1 approving review + code-owner review + three
# status checks, and `enforce_admins` is false. The only way a bot could push it
# directly is a ruleset `bypass_actors` entry with `bypass_mode: always`, which
# is an unscoped "write any commit to master, force-push it, or delete it"
# permission held by a credential whose private key lives on a shared
# multi-agent host. One approval click per release is the cheaper side of that
# trade. See CONTRIBUTING.md, "Why there is no bypass actor", for the full
# reasoning and the ruleset JSON if that judgement is ever revisited.
#
# Why not release-please: its publish step only tags pull requests a human
# *merged* (release-please 16.12.0 `src/manifest.js: buildReleases()` iterates
# `findMergedReleasePullRequests()`, and `createRelease()` never writes a file),
# so `skip-github-pull-request: true` is a permanent no-op. Its PR-vs-merge
# model is exactly what this workflow implements directly, without the action.
#
# Do NOT re-add a `release-type` input to any release action. That input makes
# release-please-action build an in-memory config and ignore
# `release-please-config.json`, which is what broke release PR #15. The `validate`
# job in ci.yaml fails the build if it comes back.

on:
  push:
    branches: [master]
  # Manual escape hatch:
  #  * retry the tagging step of a release whose PR was merged but whose release
  #    is missing (the tag step is idempotent);
  #  * prepare a release for an explicit `version` when the computed one is wrong;
  #  * `dry-run` to see the plan without creating a branch or PR.
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to prepare (e.g. 0.1.3). Empty = derive from commits."
        required: false
        default: ""
      dry-run:
        description: "Only print the computed plan; do not push a branch or open a PR."
        type: boolean
        default: false

# Serialised so a re-triggered run cannot race the one creating or tagging.
concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, linux, x64, krubecible, holybits-shared]
    steps:
      # `persist-credentials: false` keeps any token out of `.git/config`; the
      # pushes below present the App token through an ephemeral helper instead.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify this run
        id: mode
        run: |
          # A merged release PR produces a push whose HEAD is the release commit.
          # That run tags; every other push prepares the next release PR.
          subject=$(git log -1 --format=%s)
          case "$subject" in
            "chore(release): "*)
              echo "mode=tag" >> "$GITHUB_OUTPUT"
              echo "This push is a release commit ($subject): tagging it."
              ;;
            *)
              echo "mode=prepare" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ---- tag path ---------------------------------------------------------
      - name: Read the released version
        id: released
        if: steps.mode.outputs.mode == 'tag'
        run: |
          version=$(python3 -c 'import json;print(json.load(open("custom_components/lumin/manifest.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Released version on this commit: $version"

      - name: Require the App credentials (tagging)
        id: creds-tag
        if: steps.mode.outputs.mode == 'tag'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          # Fail before touching the tag, with the same actionable message the
          # prepare path gives, rather than surfacing the action's raw error.
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            exit 0
          fi
          {
            echo "::error::Cannot publish v${{ steps.released.outputs.version }}: APP_ID / APP_PRIVATE_KEY are missing."
            echo ""
            echo "Add the \`agent-holybits\` App credentials as repository secrets"
            echo "(\`APP_ID\` = \`4048591\`, \`APP_PRIVATE_KEY\` = the App's PEM), then"
            echo "re-run this workflow from the Actions tab or via"
            echo "\`workflow_dispatch\`. The tagging step is idempotent, so re-running"
            echo "after the secrets exist publishes the release with no code change."
            echo ""
            echo "The version commit is already on \`master\`; no tag was created."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Mint the App token (tagging)
        id: app-token
        if: steps.mode.outputs.mode == 'tag'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # `app-id` is a supported (deprecated) alias of `client-id` in v3.3.0:
          # dist/main.cjs does `getInput("client-id") || getInput("app-id")`.
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create the tag and GitHub release
        if: steps.mode.outputs.mode == 'tag'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.released.outputs.version }}
        run: |
          TAG="v$VERSION"
          # Idempotent: a re-run after a partial failure must not fail.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          python3 - "$VERSION" > /tmp/release-notes.md <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[?{re.escape(version)}\]?[ (].*?(?=^## |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          print(match.group(0).strip() if match else f"Release v{version}")
          PY
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

      # ---- prepare path -----------------------------------------------------
      - name: Plan the next release
        id: plan
        if: steps.mode.outputs.mode == 'prepare'
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT_VERSION" ]; then
            {
              echo "release=true"
              echo "version=$EXPLICIT_VERSION"
              echo "previous_version=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
              echo "reason=explicit version from workflow_dispatch"
            } | tee -a "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/release.py plan | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Report the plan
        if: steps.mode.outputs.mode == 'prepare'
        run: |
          {
            echo "### Release plan"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| release | \`${{ steps.plan.outputs.release }}\` |"
            echo "| version | \`${{ steps.plan.outputs.version }}\` |"
            echo "| previous | \`${{ steps.plan.outputs.previous_version }}\` |"
            echo "| reason | ${{ steps.plan.outputs.reason }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail BEFORE writing anything, so a missing secret leaves no branch, no
      # PR and no tag behind. (`secrets` is unavailable in `if:`, hence the
      # in-script check on env values.)
      - name: Require the App credentials (release PR)
        id: creds
        if: steps.mode.outputs.mode == 'prepare' && steps.plan.outputs.release == 'true' && inputs.dry-run != true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$APP_ID" ] && missing="APP_ID"
          [ -z "$APP_PRIVATE_KEY" ] && missing="${missing:+$missing, }APP_PRIVATE_KEY"
          {
            echo "::error::A release is due but these repository secrets are missing: $missing"
            echo ""
            echo "### Admin action required"
            echo ""
            echo "Add the \`agent-holybits\` App credentials as repository secrets"
            echo "\`APP_ID\` (\`4048591\`) and \`APP_PRIVATE_KEY\` (the App's PEM)."
            echo "See CONTRIBUTING.md, \"One-time setup\". No branch-protection or"
            echo "ruleset change is needed."
            echo ""
            echo "Nothing was pushed and no tag was created."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Mint the App token (release PR)
        id: app-token-pr
        if: steps.creds.outputs.ok == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # `contents: write` to push the release branch, `pull-requests: write`
          # to open the PR. Deliberately no ruleset bypass: this token cannot
          # write to `master` and must not be able to.
          permission-contents: write
          permission-pull-requests: write

      - name: Write the version bump
        if: steps.creds.outputs.ok == 'true'
        env:
          VERSION: ${{ inputs.version || steps.plan.outputs.version }}
        run: |
          python3 .github/scripts/release.py apply \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY"

      - name: Open or update the release pull request
        env:
          GH_TOKEN: ${{ steps.app-token-pr.outputs.token }}
          APP_SLUG: ${{ steps.app-token-pr.outputs.app-slug }}
          VERSION: ${{ inputs.version || steps.plan.outputs.version }}
        if: steps.creds.outputs.ok == 'true'
        run: |
          BRANCH="release/v$VERSION"
          if git diff --quiet; then
            echo "Version files already at $VERSION; nothing to publish."
            exit 0
          fi
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add custom_components/lumin/manifest.json \
                  .release-please-manifest.json \
                  CHANGELOG.md
          git commit -m "chore(release): v$VERSION"

          git_auth() {
            git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' "$@"
          }
          # A re-run must refresh its own branch (and dismiss any stale approval)
          # without clobbering a commit somebody else pushed there. Pinning the
          # lease to the current remote value does that; a plain
          # `--force-with-lease` fails with "stale info" because a fresh
          # checkout has no remote-tracking ref for a branch it never fetched.
          if git_auth ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git_auth fetch --no-tags origin "$BRANCH"
            lease="--force-with-lease=refs/heads/$BRANCH:$(git rev-parse FETCH_HEAD)"
          else
            lease=""
          fi
          # shellcheck disable=SC2086  # $lease is either empty or one --flag=value
          git_auth push $lease origin "HEAD:refs/heads/$BRANCH"

          python3 - "$VERSION" > /tmp/release-pr-body.md <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[?{re.escape(version)}\]?[ (].*?(?=^## |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          body = match.group(0).strip() if match else f"Release v{version}"
          print(body)
          print()
          print("---")
          print(
              "Merging this releases `v%s`: the push it creates is detected by "
              "`.github/workflows/release.yaml`, which tags the commit and "
              "publishes the GitHub release. HACS installs that release."
              % version
          )
          print()
          print(
              "The version files were written automatically from the "
              "conventional commits since the previous tag. Review the "
              "changelog above; if the version is wrong, run the Release "
              "workflow with an explicit `version`."
          )
          PY

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/release-pr-body.md
            echo "Updated the existing release PR for $BRANCH."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base master --head "$BRANCH" \
              --title "chore(release): v$VERSION" \
              --body-file /tmp/release-pr-body.md
          fi

          # A newer bump supersedes any earlier open release PR (for example a
          # `feat` merging while a patch release PR is open makes that one stale).
          # Leaving both open would tag a version whose changelog contradicts the
          # other. Only this workflow's own `release/*` branches are touched.
          current=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq .number)
          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/")) | "\(.number) \(.headRefName)"' |
            while read -r number head; do
              [ "$head" = "$BRANCH" ] && continue
              gh pr close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "Superseded by #$current, which contains the same commits under the current version."
            done
