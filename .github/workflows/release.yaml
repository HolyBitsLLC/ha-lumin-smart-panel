name: Release
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: [self-hosted, linux, x64, krubecible, holybits-shared]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}

  # `sync-manifest` used to `git push` a manifest.json version bump to master
  # after release-please created the release. That push can never succeed on a
  # protected branch (`GH006: 3 of 3 required status checks are expected`), and
  # it was never needed: `release-please-config.json` lists
  # `custom_components/lumin/manifest.json` in `extra-files`, and release-please
  # bumps it inside the release PR together with `.release-please-manifest.json`
  # (verified on the 0.1.1 release PR #13, which changed both files). The guard
  # that replaced it lives in ci.yaml's `validate` job: it fails when the two
  # files disagree, which catches a skipped updater before the tag exists —
  # where a post-release push could not have helped anyway.
  #
  # `dispatch-image-build` used to dispatch `publish-image.yaml` at the new tag,
  # because release-please mints the tag with GITHUB_TOKEN and GitHub does not
  # run `on: push: tags` workflows for a tag pushed by GITHUB_TOKEN. The image
  # pipeline was retired (ADR-0162: HACS delivers this integration from the
  # GitHub release; no workload pulls the Harbor payload image), so there is
  # nothing to dispatch. Restoring a Harbor carrier means restoring that
  # workflow and this job together.
