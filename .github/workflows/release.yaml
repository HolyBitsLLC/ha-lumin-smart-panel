name: Release
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: [self-hosted, linux, x64, krubecible, holybits-shared]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56e235 # v4.1.3
        id: release
        with:
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}

  sync-manifest:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, linux, x64, krubecible, holybits-shared]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json version
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          python3 -c "
          import json, pathlib
          p = pathlib.Path('custom_components/lumin/manifest.json')
          m = json.loads(p.read_text())
          m['version'] = '${VERSION}'
          p.write_text(json.dumps(m, indent=2) + '\n')
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/lumin/manifest.json
          git diff --cached --quiet || git commit -m "chore: sync manifest.json to v${VERSION}"
          git push

  dispatch-image-build:
    # release-please creates the tag with GITHUB_TOKEN, and GitHub does not run
    # workflows for a tag push raised by GITHUB_TOKEN (ADR-0073 Amendment 1).
    # The `on: push: tags: ["v*"]` trigger in publish-image.yaml therefore never
    # fires for a release tag, so dispatch that workflow at the new tag
    # explicitly. Without this, a release would publish no `vX.Y.Z` image.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the image build at the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh workflow run publish-image.yaml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
