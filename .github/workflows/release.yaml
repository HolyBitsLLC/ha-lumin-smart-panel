name: Release

# Auto-release on merge to master. There is no release pull request: this
# workflow derives the next version from the conventional commits since the last
# `v*` tag, writes the version files, commits them, then tags and releases that
# commit.
#
# Why not release-please? Its publish step only tags pull requests that a human
# *merged*: release-please 16.12.0 `src/manifest.js: buildReleases()` iterates
# `findMergedReleasePullRequests()`, and `createRelease()` only calls
# `github.createRelease` — it never writes a version file. So
# `skip-github-pull-request: true` opens no PR, finds no merged PR to tag, and
# writes nothing: it is a permanent no-op, not an auto-release mode.
#
# Do NOT re-add a `release-type` input to any release action. That input makes
# release-please-action build an in-memory config and ignore
# `release-please-config.json` — which is what broke release PR #15 — and the
# `validate` job in ci.yaml fails the build if it comes back.
#
# `release-please-config.json` is still the source of truth for the version-file
# list (`extra-files`) and the pre-1.0 bump flags; `.github/scripts/release.py`
# reads both.
#
# AUTH — the `agent-holybits` GitHub App, no PAT.
# The version commit has to land on protected `master`. An App installation
# token is not a repository admin, and classic branch protection has no bypass
# list (only `enforce_admins`), so the App is blocked with `GH006` until master
# is migrated to a *ruleset* that lists the App in `bypass_actors`. That
# migration is a one-time admin step documented in CONTRIBUTING.md; until it is
# done this job fails before creating a commit or a tag.

on:
  push:
    branches: [master]
  # Manual escape hatch, deliberately kept:
  #  * re-run a release that failed *after* the version commit landed but before
  #    the tag/release existed (the tag step is idempotent);
  #  * release an explicit `version` when the computed one is wrong.
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to release (e.g. 0.1.2). Empty = derive from commits."
        required: false
        default: ""
      dry-run:
        description: "Only print the computed release plan; do not commit, tag or release."
        type: boolean
        default: false

# Serialised so the push that re-triggers this workflow cannot race the run that
# is already creating the tag.
concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, linux, x64, krubecible, holybits-shared]
    steps:
      # `persist-credentials: false` keeps any token out of `.git/config`; the
      # push below presents the App installation token through an ephemeral
      # credential helper instead.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip a run re-triggered by the release commit
        id: dedupe
        run: |
          # The push that creates the version commit re-triggers this workflow.
          # Its HEAD is that commit, so there is nothing to release. A manual
          # dispatch bypasses this so a half-finished release can be retried.
          subject=$(git log -1 --format=%s)
          case "$subject" in
            "chore(release): "*)
              if [ "${{ github.event_name }}" = "push" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "HEAD is a release commit ($subject); nothing to do."
                exit 0
              fi
              ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Plan release
        id: plan
        if: steps.dedupe.outputs.skip != 'true'
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT_VERSION" ]; then
            {
              echo "release=true"
              echo "version=$EXPLICIT_VERSION"
              echo "previous_version=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
              echo "reason=explicit version from workflow_dispatch"
            } | tee -a "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/release.py plan | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Report the plan
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          {
            echo "### Release plan"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| release | \`${{ steps.plan.outputs.release }}\` |"
            echo "| version | \`${{ steps.plan.outputs.version }}\` |"
            echo "| previous | \`${{ steps.plan.outputs.previous_version }}\` |"
            echo "| reason | ${{ steps.plan.outputs.reason }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail BEFORE anything is written or tagged. `secrets` is not available in
      # an `if:` expression, hence the in-script check on the env values.
      - name: Require the App credentials
        id: creds
        if: steps.plan.outputs.release == 'true' && inputs.dry-run != true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$APP_ID" ] && missing="APP_ID"
          [ -z "$APP_PRIVATE_KEY" ] && missing="${missing:+$missing, }APP_PRIVATE_KEY"
          {
            echo "::error::A release is due but these repository secrets are missing: $missing"
            echo ""
            echo "### Admin action required"
            echo ""
            echo "Configure the \`agent-holybits\` GitHub App credentials as repository"
            echo "secrets \`APP_ID\` and \`APP_PRIVATE_KEY\` (see CONTRIBUTING.md,"
            echo "\"One-time admin setup\"), and make sure master is protected by the"
            echo "ruleset that lists the App (id \`4048591\`) in \`bypass_actors\`."
            echo ""
            echo "No version commit and no tag were created, so nothing is inconsistent."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Pinned to v3.3.0. `app-id` is a supported (deprecated) alias of
      # `client-id` in this version — verified in dist/main.cjs:
      # `getInput("client-id") || getInput("app-id")` — which is why the
      # numeric App ID in APP_ID works without also storing the client ID.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: steps.creds.outputs.ok == 'true'
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Apply the version bump
        if: steps.creds.outputs.ok == 'true'
        env:
          VERSION: ${{ inputs.version || steps.plan.outputs.version }}
        run: |
          python3 .github/scripts/release.py apply \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY"

      - name: Commit and push the version bump
        id: commit
        if: steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ inputs.version || steps.plan.outputs.version }}
        run: |
          # Attribute the commit to the App itself, matching how every other
          # agent commit on this repo is authored. The bot user id is read from
          # the API rather than guessed (the email is not derived from the app
          # id): `gh api "users/$APP_SLUG[bot]" --jq .id`.
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Version files already at $VERSION; nothing to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add custom_components/lumin/manifest.json \
                  .release-please-manifest.json \
                  CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the GitHub release
        if: steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version || steps.plan.outputs.version }}
        run: |
          TAG="v$VERSION"
          # Idempotent: a manual re-run after a failed tag step must not fail.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          python3 - "$VERSION" > /tmp/release-notes.md <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[?{re.escape(version)}\]?[ (].*?(?=^## |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          print(match.group(0).strip() if match else f"Release v{version}")
          PY
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
