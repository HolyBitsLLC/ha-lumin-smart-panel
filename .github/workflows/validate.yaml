name: Validate

# HACS repository validation for the `lumin` integration.
#
# `main`/`master` here is PR-only, and a HACS install is the supported delivery
# path for this component (harvester-argo ADR-0157), so a change that makes the
# repository invalid in HACS must fail review rather than fail silently in the
# Home Assistant UI. The action runs the same validators HACS uses, with
# `category: integration`.
#
# Runner policy: this job is pinned to `ubuntu-latest` for EVERY event, unlike
# ci.yaml which uses the self-hosted pool for pushes to `master`.
#
# `hacs/action` is a Docker *container* action (`action.yml`:
# `image: docker://ghcr.io/hacs/action:main`), so it needs a Docker daemon. The
# self-hosted pool deliberately has no Docker: image builds happen with kaniko
# inside Kubernetes, not with a daemon on the runner. Running this job there
# fails on every push to `master` — observed on `e620b58`:
#   "Cannot connect to the Docker daemon at unix:///var/run/docker.sock"
#   "[error] Docker pull failed with exit code 1"
# which is exactly why it passed on PRs (GitHub-hosted) and failed on push
# (self-hosted). Do NOT try to install Docker or add a DinD sidecar to the
# runner to "fix" this: the missing daemon is intentional.
#
# The alternative — reimplementing HACS's validators as plain Python steps — was
# rejected: it would have to track hacs/integration's own validators to stay
# equivalent, and a drifting copy silently weakens the check. This costs
# GitHub-hosted minutes, which are free for this public repository.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    # Always GitHub-hosted: see the runner-policy note at the top of this file.
    # Pushing this job back onto the self-hosted pool makes it fail on every
    # release commit, since that pool has no Docker daemon by design.
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        # Pinned to the 22.5.0 release commit, like every other action in this
        # repo: `@main` would let the validator change under us, which is the
        # same unpinned-remote problem this workflow exists to catch.
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # `brands` and `topics` are requirements for inclusion in the HACS
          # *default* repository list, not for a custom repository: HACS
          # installs this repo without them. `brands` would need an icon in the
          # upstream home-assistant brands repo; `topics` is repository
          # metadata (a settings change, not a commit). `license` is ignored
          # because this repository has no LICENSE file yet — picking one is an
          # owner decision, and HACS does not require it to install. Everything
          # else stays enforced: hacsjson (the hacs.json schema, which rejects
          # unknown keys), integration_manifest (domain/documentation/
          # issue_tracker/codeowners/name/version), information (README),
          # description, issues, archived.
          ignore: brands topics license
